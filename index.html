/* =====================================================
   IMAGE MATCHING
===================================================== */
function imageNames(foodName){

    let result = [];

    let parts = foodName
        .split("/")
        .map(x => x.trim())
        .filter(Boolean);

    parts.push(foodName.trim());

    parts.forEach(part => {

        let name = part.trim();

        let variations = [
            name,
            name.toLowerCase(),
            name.replace(/\s+/g, "-"),
            name.replace(/\s+/g, "_"),
            name.replace(/\s+/g, ""),
            name.replace(/[^a-z0-9()]+/g, "-"),
            name.replace(/[^a-z0-9()]+/g, "_"),
            name.replace(/[()]/g, ""),
            name.replace(/[()]/g, "").replace(/\s+/g, "-"),
            name.replace(/[()]/g, "").replace(/\s+/g, "_")
        ];

        variations.forEach(v => {

            if(v){
                result.push(v + ".jpg");
                result.push(v + ".jpeg");
            }

        });

    });

    return [...new Set(result)];
}

function loadImage(img,name){

    let list=imageNames(name);
    let i=0;

    function next(){

        if(i>=list.length){

            img.alt=name;
            return;
        }

        img.src=list[i];
        i++;

    }

    img.onerror=next;

    next();
}

function displayMenu(){

            let div=document.createElement("div");

            div.className="food";
            div.dataset.name=food[1].toLowerCase();

            let left=document.createElement("div");

            left.className="food-left";

            let img=document.createElement("img");

            img.className="food-image";
            img.alt=food[1];

            loadImage(img,food[1]);

            let info=document.createElement("div");

            let name=document.createElement("div");

            name.className="food-name";
            name.textContent=food[1];

            let price=document.createElement("div");

            if(food[2]===0){

                price.className="season";
                price.textContent="Price to be confirmed";

            }else{

                price.className="price";
                price.textContent="₹"+food[2];

            }

            info.appendChild(name);
            info.appendChild(price);

            left.appendChild(img);
            left.appendChild(info);

            let controls=document.createElement("div");

            controls.className="controls";

            let minus=document.createElement("button");

            minus.className="qty-btn";
            minus.textContent="−";

            minus.onclick=()=>decrease(index);

            let qty=document.createElement("span");

            qty.className="qty";
            qty.id="qty-"+index;
            qty.textContent="0";

            let plus=document.createElement("button");

            plus.className="qty-btn plus";
            plus.textContent="+";

            plus.onclick=()=>increase(index);

            controls.appendChild(minus);
            controls.appendChild(qty);
            controls.appendChild(plus);

            div.appendChild(left);
            div.appendChild(controls);

            menu.appendChild(div);

        });

    });

    updateCounts();
}

/* =====================================================
   CART FUNCTIONS
===================================================== */

function increase(index){

    let item=cart.find(x=>x.index===index);

    if(item){

        item.qty++;

    }else{

        cart.push({
            index:index,
            qty:1
        });

    }

    displayCart();
}

function decrease(index){

    let item=cart.find(x=>x.index===index);

    if(!item)return;

    item.qty--;

    if(item.qty<=0){

        cart=cart.filter(
            x=>x.index!==index
        );

    }

    displayCart();
}

function removeItem(index){

    cart=cart.filter(
        x=>x.index!==index
    );

    displayCart();
}

function updateCounts(){

    foods.forEach((food,index)=>{

        let element=
            document.getElementById(
                "qty-"+index
            );

        if(!element)return;

        let item=
            cart.find(x=>x.index===index);

        element.textContent=
            item ? item.qty : "0";

    });

}

function displayCart(){

    let box=
        document.getElementById("cartItems");

    let totalBox=
        document.getElementById("total");

    box.innerHTML="";

    if(cart.length===0){

        box.innerHTML=
            '<div class="empty">Cart is empty</div>';

        totalBox.textContent="0";

        updateCounts();

        return;
    }

    let total=0;

    cart.forEach(item=>{

        let food=foods[item.index];

        if(food[2]>0){

            total+=food[2]*item.qty;

        }

        let row=document.createElement("div");

        row.className="cart-item";

        let info=document.createElement("div");

        info.innerHTML=
            "<b>"+escapeHTML(food[1])+"</b><br>"+
            (
                food[2]===0
                ?"Price to be confirmed"
                :"₹"+food[2]+" × "+item.qty
            );

        let controls=
            document.createElement("div");

        controls.className="cart-controls";

        let minus=
            document.createElement("button");

        minus.className="qty-btn";
        minus.textContent="−";
        minus.onclick=()=>decrease(item.index);

        let qty=document.createElement("b");

        qty.textContent=item.qty;

        let plus=
            document.createElement("button");

        plus.className="qty-btn plus";
        plus.textContent="+";
        plus.onclick=()=>increase(item.index);

        let remove=
            document.createElement("button");

        remove.className="remove";
        remove.textContent="Remove";
        remove.onclick=()=>removeItem(item.index);

        controls.appendChild(minus);
        controls.appendChild(qty);
        controls.appendChild(plus);
        controls.appendChild(remove);

        row.appendChild(info);
        row.appendChild(controls);

        box.appendChild(row);

    });

    totalBox.textContent=total;

    updateCounts();
}

/* =====================================================
   SEARCH
===================================================== */

function searchFood(){

    let value=
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    document
        .querySelectorAll(".food")
        .forEach(food=>{

            food.classList.toggle(
                "hidden",
                !food.dataset.name.includes(value)
            );

        });

    document
        .querySelectorAll(".category")
        .forEach(category=>{

            let next=
                category.nextElementSibling;

            let found=false;

            while(
                next &&
                !next.classList.contains("category")
            ){

                if(
                    next.classList.contains("food") &&
                    !next.classList.contains("hidden")
                ){

                    found=true;

                }

                next=next.nextElementSibling;

            }

            category.classList.toggle(
                "hidden",
                !found
            );

        });

}

    }

    let total=0;

    let message=
`🍽️ *NEW FOOD ORDER*

🏨 *Room Number:* ${room}
📞 *Customer Phone:* ${phone}

━━━━━━━━━━━━━━━━
🛒 *ORDER DETAILS*
━━━━━━━━━━━━━━━━

`;

    cart.forEach((item,index)=>{

            total+=amount;

       ?"Price to be confirmed"

   }

Thank you for ordering with us! 😊`;

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

    return text.replace(
        /[&<>"']/g,
        character=>({

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        }[character])
    );

}
